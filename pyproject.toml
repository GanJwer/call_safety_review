[project]
name = "call-safety-review"
version = "1.0.0"
description = "内容安全预检智能体：发起外部调用前，提供安全检查与风险判断，帮助识别潜在的内容、权限和数据风险，并给出审查结论及安全处理建议。"
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = { text = "Proprietary" }
# wit / acps-sdk 由发行目录的 wheel 提供（先装 acps-sdk 2.2.0，再装 wit-framework 2.1.0），
# 不通过包索引解析，因此这里不声明为可解析依赖。
dependencies = []

[project.optional-dependencies]
# 仅在使用 RabbitMQ 版 AIP Group 时需要，与 wit wheel 的 [acps-group] extra 配套。
acps-group = ["aio-pika>=10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "acps_interop: requires externally managed ACPs infrastructure",
]

[tool.ruff]
line-length = 110
target-version = "py312"
